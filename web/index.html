<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账户管理</title>

.396.462-4.435-1.77-3.759-4.114l16.646-57.705c.677-2.35-1.37-4.583-3.769-4.113Z%22%3E%3C%2Fpath%3E%3C%2Fsvg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="identity">
        <div class="product-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 3.5 27 9.8v12.4L16 28.5 5 22.2V9.8L16 3.5Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="m10.5 16 3.6 3.7 7.5-8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
        <div class="title-row">
          <p class="eyebrow">CPA ACCOUNT PILOT</p>
          <h1 id="pageTitle">账户管理</h1>
        </div>
        <p id="pageSubtitle" class="subtitle">导入账户文件中的账户对象，刷新邮箱地址获取邮件信息并持久化回写数据。</p>
        </div>
      </div>
    </div>

    <section class="toolbar" aria-label="操作栏">
      <div class="workflow-actions">
        <div id="settingsWrap" class="settings-wrap">
        <button id="settingsBtn" class="settings-btn" type="button" aria-expanded="false" aria-controls="settingsPanel" aria-label="Settings" title="Settings">
          <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9.7 3.4 9.3 5a1.8 1.8 0 0 1-2.1 1.2l-1.6-.4-1.5 2.6 1.2 1.1a1.8 1.8 0 0 1 0 2.6l-1.2 1.1 1.5 2.6 1.6-.4A1.8 1.8 0 0 1 9.3 17l.4 1.6h3l.4-1.6a1.8 1.8 0 0 1 2.1-1.2l1.6.4 1.5-2.6-1.2-1.1a1.8 1.8 0 0 1 0-2.6l1.2-1.1-1.5-2.6-1.6.4A1.8 1.8 0 0 1 13.1 5l-.4-1.6h-3Z"></path>
            <circle cx="11.2" cy="11" r="2.5"></circle>
          </svg>
        </button>
        <div id="settingsPanel" class="settings-panel hidden" role="dialog" aria-labelledby="settingsPanelTitle" aria-hidden="true">
          <p id="settingsPanelTitle" class="settings-title">设置</p>
          <p id="accountFieldsTitle" class="settings-section-title">账户字段</p>
          <div class="account-fields-grid">
            <label class="settings-field" for="emailFieldInput">
              <span id="emailFieldLabel">邮箱字段</span>
              <input id="emailFieldInput" class="search-input" type="text" placeholder="email">
            </label>
            <label class="settings-field" for="passwordFieldInput">
              <span id="passwordFieldLabel">密码字段</span>
              <input id="passwordFieldInput" class="search-input" type="text" placeholder="password">
            </label>
            <label class="settings-field" for="mailboxUrlFieldInput">
              <span id="mailboxUrlFieldLabel">邮箱地址字段</span>
              <input id="mailboxUrlFieldInput" class="search-input" type="text" placeholder="mailbox_url">
            </label>
          </div>
        </div>
      </div>
        <button id="openFileBtn" class="primary" type="button">导入账户</button>
        <input id="fileInput" class="hidden" type="file">
        <button id="reloadFileBtn" type="button" disabled>刷新认证</button>
        <button id="refreshBtn" type="button" disabled>刷新邮箱</button>
      </div>
      <div class="query-controls">
        <span class="filter-label">筛选视图</span>
        <div id="statusFilter" class="segmented-control status-filter" role="group" aria-label="认证状态">
          <button class="segmented-option status-filter-option is-active" type="button" data-status-filter="all" aria-pressed="true">全部</button>
        </div>
        <div id="mailboxFilter" class="segmented-control mailbox-filter" role="group" aria-label="Mailbox filter">
          <button class="segmented-option mailbox-filter-option is-active" type="button" data-mailbox-filter="all" aria-pressed="true">全部</button>
          <button class="segmented-option mailbox-filter-option" type="button" data-mailbox-filter="with" aria-pressed="false">有邮箱</button>
          <button class="segmented-option mailbox-filter-option" type="button" data-mailbox-filter="without" aria-pressed="false">无邮箱</button>
        </div>
        <label class="field search-field" for="searchInput">
          <input id="searchInput" class="search-input" type="search" placeholder="输入多个关键字，空格分隔">
        </label>
      </div>
    </section>

    <div class="message-row" role="status" aria-live="polite">
      <span class="message-indicator" aria-hidden="true"></span>
      <p id="message" class="message">请选择账户文件。</p>
    </div>

    <section id="emptyState" class="empty">
      未加载账户数据。
    </section>

    <section id="tableShell" class="table-shell hidden" aria-label="账户邮件信息表格">
      <table>
        <colgroup>
          <col class="col-email">
          <col class="col-password">
          <col class="col-mail-info">
          <col class="col-auth-status">
          <col class="col-auth-status-msg">
          <col class="col-auth-meta">
          <col class="col-action">
        </colgroup>
        <thead>
          <tr>
            <th id="emailHeader">邮箱</th>
            <th id="passwordHeader">密码</th>
            <th id="mailInfoHeader">邮件主题 / UTC+8</th>
            <th id="authStatusHeader">认证状态</th>
            <th id="authDescriptionHeader">描述</th>
            <th id="authMetaHeader">账户信息</th>
            <th id="actionsHeader">操作</th>
          </tr>
        </thead>
        <tbody id="accountRows"></tbody>
      </table>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
